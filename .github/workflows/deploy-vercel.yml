name: Export Godot HTML5 and deploy to Vercel

on:
  push:
    branches:
      - main

concurrency:
  group: vercel-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-html5:
    name: Export Godot HTML5
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4
    permissions:
      contents: read
    env:
      EXPORT_PRESET: Web
      EXPORT_DIR: build/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Export Godot project to HTML5
        run: |
          mkdir -p "$EXPORT_DIR"
          godot --headless --verbose --export-release "$EXPORT_PRESET" "$EXPORT_DIR/index.html"

      - name: Upload exported site artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-html5-export
          path: ${{ env.EXPORT_DIR }}

  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: export-html5
    permissions:
      contents: read
    env:
      EXPORT_DIR: build/web
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Download exported site artifact
        uses: actions/download-artifact@v4
        with:
          name: godot-html5-export
          path: ${{ env.EXPORT_DIR }}

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy exported site to Vercel
        run: vercel deploy "$EXPORT_DIR" --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"
