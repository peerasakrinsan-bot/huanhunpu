name: Export Godot HTML5 and deploy to Vercel

on:
  push:
    branches:
      - main

concurrency:
  group: vercel-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-html5:
    name: Export Godot HTML5
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4
    permissions:
      contents: read
    env:
      EXPORT_PRESET: Web
      EXPORT_DIR: build/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot export templates
        shell: bash
        env:
          GODOT_VERSION: 4.4
          GODOT_RELEASE: 4.4-stable
          GODOT_TEMPLATES_DIR: /github/home/.local/share/godot/export_templates/4.4.stable
        run: |
          set -euo pipefail
          mkdir -p "$GODOT_TEMPLATES_DIR"
          curl --fail --location --retry 3 --output /tmp/godot_export_templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          unzip -q -o /tmp/godot_export_templates.tpz 'templates/*' -d /tmp/godot_export_templates
          cp /tmp/godot_export_templates/templates/* "$GODOT_TEMPLATES_DIR"/
          test -f "$GODOT_TEMPLATES_DIR/web_release.zip"
          test -f "$GODOT_TEMPLATES_DIR/web_debug.zip"
          godot --headless --version | grep --fixed-strings "$GODOT_VERSION"

      - name: Verify Web export preset
        shell: bash
        run: |
          set -euo pipefail
          test -f export_presets.cfg
          grep -A2 '^\[preset\.0\]' export_presets.cfg | grep --fixed-strings 'name="Web"'
          grep -A3 '^\[preset\.0\]' export_presets.cfg | grep --fixed-strings 'platform="Web"'

      - name: Export Godot project to HTML5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EXPORT_DIR"
          godot --headless --verbose --export-release "$EXPORT_PRESET" "$EXPORT_DIR/index.html"
          test -f "$EXPORT_DIR/index.html"

      - name: Upload exported site artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-html5-export
          path: ${{ env.EXPORT_DIR }}

  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: export-html5
    permissions:
      contents: read
    env:
      EXPORT_DIR: build/web
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Download exported site artifact
        uses: actions/download-artifact@v4
        with:
          name: godot-html5-export
          path: ${{ env.EXPORT_DIR }}

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy exported site to Vercel
        run: vercel deploy "$EXPORT_DIR" --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"
